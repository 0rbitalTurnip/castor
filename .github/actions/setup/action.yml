name: Setup
description: Go toolchain and cached libwhisper.a for the cgo build

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - id: whisper
      shell: bash
      run: echo "rev=$(git -C third_party/whisper.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: third_party/whisper.cpp/build_go
        key: libwhisper-${{ runner.os }}-${{ steps.whisper.outputs.rev }}
        restore-keys: |
          libwhisper-${{ runner.os }}-
    - shell: bash
      run: |
        echo "whisper rev=${{ steps.whisper.outputs.rev }}"
        if [ ! -d third_party/whisper.cpp ]; then
          echo "warning: third_party/whisper.cpp not present"
        fi
    - shell: bash
      run: make lib && go mod download
